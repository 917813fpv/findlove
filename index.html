<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff6f1">
<title>找对象—— · findlove</title>
<meta name="description" content="findlove：一朵可以发消息的云。不用注册，点别人的气泡就能私聊回复。">
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="splash" aria-hidden="true">
  <div class="splash-inner">
    <p class="splash-kicker">一个很小的交友实验</p>
    <h1 class="splash-title"><span>找</span><span>对</span><span>象</span><span class="dash">——</span></h1>
    <p class="splash-sub">不用注册，发个气泡，等人来捡。</p>
  </div>
</div>

<header class="top">
  <a class="brand" href="/">findlove<span>.</span></a>
  <div class="top-actions">
    <button class="ghost" id="inboxBtn" type="button">回复 <em id="unread">0</em></button>
    <button class="post-btn" id="postBtn" type="button">发个气泡</button>
  </div>
</header>

<main class="cloud-wrap">
  <div class="cloud-meta"><span id="count">0 个气泡在飘</span><span class="hint-line">点一个气泡，回 TA</span></div>
  <div id="cloud" class="cloud" aria-live="polite"></div>
  <div id="empty" class="empty" hidden>
    <p>云上还很安静。</p>
    <button class="post-btn" id="emptyPost" type="button">发第一个气泡</button>
  </div>
</main>

<div class="modal" id="compose" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="composeTitle">
    <button class="x" data-close type="button" aria-label="关闭">×</button>
    <h2 id="composeTitle">发个气泡</h2>
    <label class="field"><span>怎么称呼</span><input id="nick" maxlength="16" placeholder="随便起一个" autocomplete="off"></label>
    <div class="field media-field">
      <span>头像和主页图（自动压缩）</span>
      <div class="media-row">
        <label class="pick avatar-pick"><input type="file" id="avatarInput" accept="image/*" hidden><span id="avatarPrev">＋ 头像</span></label>
        <label class="pick"><input type="file" id="picsInput" accept="image/*" multiple hidden><span>＋ 主页图</span></label>
      </div>
      <div class="pics" id="picsPrev"></div>
    </div>
    <div class="field"><span>性别</span><div class="genders" id="genders"></div></div>
    <div class="field age-field">
      <span>年龄 <b id="ageOut">18</b></span>
      <div class="wheel-wrap">
        <div class="wheel" id="wheel" tabindex="0" role="slider" aria-label="年龄" aria-valuemin="-99" aria-valuemax="200" aria-valuenow="18">
          <div class="wheel-ring"></div>
          <div class="wheel-ticks" id="ticks"></div>
          <div class="wheel-knob" id="knob"></div>
          <div class="wheel-center"><b id="ageBig">18</b><em>岁</em></div>
        </div>
        <p class="wheel-note">可以转到负数，年龄只是个玩笑。</p>
      </div>
    </div>
    <label class="field"><span>说点什么</span><textarea id="text" maxlength="120" rows="3" placeholder="今晚有人一起飞吗？"></textarea></label>
    <p class="err" id="err"></p>
    <button class="submit" id="send" type="button">放上云</button>
  </div>
</div>

<div class="modal" id="panelModal" hidden>
  <div class="sheet panel" role="dialog" aria-modal="true">
    <button class="x" data-close type="button" aria-label="关闭">×</button>
    <div id="panelBody"></div>
  </div>
</div>

<div class="modal" id="inboxModal" hidden>
  <div class="sheet" role="dialog" aria-modal="true">
    <button class="x" data-close type="button" aria-label="关闭">×</button>
    <h2>有人回你</h2>
    <div id="inboxList" class="inbox-list"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>
<script src="/love.js"></script>
</body>
</html>
